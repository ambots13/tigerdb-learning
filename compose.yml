# Convenience only. The lab's primary path is `npm run db:up` (scripts/db.sh),
# which needs nothing but Docker itself.
services:
  tigerdb:
    image: timescale/timescaledb-ha:pg17
    container_name: tigerdb-lab
    environment:
      POSTGRES_PASSWORD: tigerlab
      POSTGRES_DB: tigerlab
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tigerlab"]
      interval: 2s
      timeout: 5s
      retries: 30
