<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TigerData Learning Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>TigerData <span>Learning Lab</span></h1>
      <nav id="schema" class="schema"></nav>
    </header>

    <main>
      <aside id="sidebar">
        <div class="sidebar-head">
          <label for="module-select">Module</label>
          <select id="module-select"></select>
        </div>
        <p class="sql-guide-hint">Hover or focus highlighted SQL for explanations and useful alternatives.</p>
        <div id="lesson" class="lesson"></div>
      </aside>

      <section class="workbench">
        <div class="editor-wrap">
          <div class="editor-head">
            <span>SQL</span>
            <span class="hint">Ctrl/Cmd + Enter to run</span>
            <button id="explain" class="ghost">Explain</button>
            <button id="run">Run</button>
          </div>
          <textarea id="sql" spellcheck="false">SELECT time_bucket('1 hour', time) AS bucket,
       sensor_id,
       round(avg(temperature)::numeric, 2) AS avg_temp
FROM readings
WHERE time >= now() - INTERVAL '6 hours'
GROUP BY bucket, sensor_id
ORDER BY bucket DESC, sensor_id
LIMIT 20;</textarea>
        </div>
        <div id="result" class="result">
          <p class="placeholder">Run a query, or click any <code>Run this</code> button in a lesson step.</p>
        </div>
        <section id="tutor" class="tutor" hidden aria-live="polite">
          <div class="tutor-head">
            <div>
              <strong>AI tutor</strong>
              <span id="tutor-context"></span>
            </div>
            <button id="close-tutor" class="ghost">Close</button>
          </div>
          <div id="tutor-messages" class="tutor-messages"></div>
          <form id="tutor-form" class="tutor-form">
            <label class="sr-only" for="tutor-input">Ask about this lesson item</label>
            <textarea id="tutor-input" rows="2" placeholder="Ask why this works, what to try next, or for a hint... (Enter to send; Shift+Enter for a new line)" required></textarea>
            <button id="send-tutor" type="submit">Ask</button>
          </form>
        </section>
      </section>
    </main>

    <div id="sql-insight" class="sql-insight" role="tooltip" hidden>
      <strong id="sql-insight-title"></strong>
      <p id="sql-insight-what"></p>
      <p id="sql-insight-why"></p>
      <section id="sql-insight-related" class="sql-insight-related" hidden>
        <h4>Related SQL</h4>
        <ul id="sql-insight-related-list"></ul>
      </section>
    </div>

    <script src="sql-guide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
